# goal -- I have to Lint, Build ,Test the codde for Frontend & Backend
# Then push the images to DockerHub

name: Continious-Integration

on:
  push:
    branches:
    - advance

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup NodeJs
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install npm Packages
      working-directory: frontend
      run: npm install

    - name: Run linter
      working-directory: frontend
      run: npm run lint

    - name: Run test
      working-directory: frontend
      run: npm run test

  build-and-push:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        push: true
        tags: ${{vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest



  backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
         go-version: '1.23'
         go-version-file: 'go.mod'
         check-latest: false
         cache-dependency-path: 'go.sum'

    - name: Running Go Formatter
      run: go fmt
      working-directory: backend

    - name: Running Go Vet
      run: go vet
      working-directory: backend

    - name: Running Go Test
      run: go test
      working-directory: backend
      
  build-and-push-backend:
      needs: backend
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{vars.DOCKERHUB_USERNAME }}/devboard-backend:latest
      