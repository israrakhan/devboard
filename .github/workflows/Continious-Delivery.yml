#Goal :- To deploy build image from CI steps once the CI workflow is successful.


name: Continious-Delivery
on:
    workflow_call:
#   workflow_run:
#     workflows: ["Continious-Integration"]
#     types:
#       - completed
#     branches:
#       - advance
#   workflow_dispatch:
    

jobs:
    deploy:
        runs-on: self-hosted
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Copy Example Env to main env
              run: cp .env.example .env

            - name: Docker Setup [Login]
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Deploy the containers with Docker Compose
              run: |
                docker compose down
                docker image prune -af
                docker compose pull
                docker compose up -d
